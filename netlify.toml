[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The default locale lives at the root; old /en/… links go there.
[[redirects]]
  from = "/en"
  to = "/"
  status = 301
[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301
[[redirects]]
  from = "/kr/*"
  to = "/ko/:splat"
  status = 301

# `/fr` and `/lab` are files (fr.html, lab.html) that sit next to folders of the same name: say so explicitly.
[[redirects]]
  from = "/lab"
  to = "/lab.html"
  status = 200
[[redirects]]
  from = "/fr"
  to = "/fr.html"
  status = 200
[[redirects]]
  from = "/de"
  to = "/de.html"
  status = 200
[[redirects]]
  from = "/es"
  to = "/es.html"
  status = 200
[[redirects]]
  from = "/zh"
  to = "/zh.html"
  status = 200
[[redirects]]
  from = "/ko"
  to = "/ko.html"
  status = 200
[[redirects]]
  from = "/fr/lab"
  to = "/fr/lab.html"
  status = 200
[[redirects]]
  from = "/de/lab"
  to = "/de/lab.html"
  status = 200
[[redirects]]
  from = "/es/lab"
  to = "/es/lab.html"
  status = 200
[[redirects]]
  from = "/zh/lab"
  to = "/zh/lab.html"
  status = 200
[[redirects]]
  from = "/ko/lab"
  to = "/ko/lab.html"
  status = 200

# Fingerprinted build output never changes.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
